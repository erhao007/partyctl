name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          # internal/version.version defaults to "dev"; the tag becomes `partyctl version`.
          ldflags="-s -w -X github.com/partyctl/partyctl/internal/version.version=${version}"
          for arch in amd64 arm64; do
            name="partyctl-${version}-linux-${arch}"
            staging="dist/${name}"
            mkdir -p "${staging}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${staging}/partyctl" .
            cp README.md "${staging}/README.md"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            # Stable name so /releases/latest/download/partyctl-linux-<arch>.tar.gz resolves.
            cp "dist/${name}.tar.gz" "dist/partyctl-linux-${arch}.tar.gz"
            rm -rf "${staging}"
          done
          cp install.sh dist/install.sh
          (
            cd dist
            sha256sum partyctl-*.tar.gz > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
